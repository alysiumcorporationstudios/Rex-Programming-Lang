name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v1.0.1"
        required: true

permissions:
  contents: read

jobs:
  release:
    name: build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install build ".[dev]" twine

      - name: Test before publishing
        run: python -m pytest -q

      - name: Build
        run: python -m build

      - name: Check the artifacts
        run: python -m twine check dist/*

      - name: Verify the tag matches the package version
        shell: bash
        run: |
          version=$(python -c "import rex; print(rex.__version__)")
          echo "package version: $version"
          ref="${{ inputs.tag || github.ref_name }}"
          if [ "v$version" != "$ref" ]; then
            echo "tag $ref does not match package version v$version"
            exit 1
          fi
          echo "releasing $ref"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Rex ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*

      - name: Keep the built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI verifies this workflow and environment by OIDC,
    # so no API token is stored anywhere. Set the repository variable
    # PYPI_PUBLISH=true once the project exists on PyPI.
    if: vars.PYPI_PUBLISH == 'true'
    environment:
      name: pypi
      url: https://pypi.org/project/rex-lang/
    permissions:
      id-token: write
    steps:
      - name: Download the built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
