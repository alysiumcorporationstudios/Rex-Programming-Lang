name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install build ".[dev]"

      - name: Test before publishing
        run: python -m pytest -q

      - name: Build
        run: python -m build

      - name: Verify the tag matches the package version
        shell: bash
        run: |
          version=$(python -c "import rex; print(rex.__version__)")
          echo "package version: $version"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version v$version"
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Rex ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          body: |
            A tiny, friendly scripting language for API work. Made in Mzansi.

            ```bash
            pip install rex-lang
            rex run hello.rex
            ```

            - Documentation: https://alysiumcorporationstudios.github.io/Rex-Programming-Lang/
            - Changelog: https://github.com/alysiumcorporationstudios/Rex-Programming-Lang/blob/main/CHANGELOG.md

      # Publishes to PyPI with trusted publishing once the project is set up there
      # and the repository variable PYPI_PUBLISH is "true".
      - name: Publish to PyPI
        if: vars.PYPI_PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
